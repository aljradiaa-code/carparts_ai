workflows:
  carparts-ai-android:
    name: CarPartsAI Android Build
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: فك ملف المشروع
        script: |
          unzip -o carparts_ai.zip -d .
      - name: تثبيت الحزم
        script: |
          cd carparts_ai
          flutter pub get
      - name: بناء ملف APK
        script: |
          cd carparts_ai
          flutter build apk --release
    artifacts:
      - carparts_ai/build/app/outputs/**/*.apk
