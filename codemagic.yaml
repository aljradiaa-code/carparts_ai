workflows:
  carparts-ai-android:
    name: CarPartsAI Android Build
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: فك ملف المشروع
        script: |
          unzip -o carparts_ai.zip -d .
      - name: توليد ملفات منصة أندرويد الناقصة
        script: |
          cd carparts_ai
          flutter create . --platforms=android --project-name carparts_ai
      - name: تعطيل تصغير الكود R8 (يفادي تعارضه مع مكتبة النموذج المحلي)
        script: |
          cd carparts_ai/android/app
          if [ -f build.gradle.kts ]; then
            cat >> build.gradle.kts << 'EOF'

android {
    buildTypes {
        getByName("release") {
            isMinifyEnabled = false
            isShrinkResources = false
        }
    }
}
EOF
          fi
          if [ -f build.gradle ]; then
            cat >> build.gradle << 'EOF'

android {
    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
    }
}
EOF
          fi
      - name: تثبيت الحزم
        script: |
          cd carparts_ai
          flutter pub get
      - name: بناء ملف APK
        script: |
          cd carparts_ai
          flutter build apk --release
    artifacts:
      - carparts_ai/build/app/outputs/**/*.apk
